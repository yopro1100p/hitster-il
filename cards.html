<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>פסקול הזמן — קלפים להדפסה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Rubik,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#e5e5e5}
  .bar{position:sticky;top:0;z-index:5;background:#0d0b14;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
  .bar input{font:inherit;padding:6px 8px;border-radius:8px;border:0;min-width:220px;direction:ltr}
  .bar button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:#ff3d8b;color:#fff;font-weight:700;cursor:pointer}
  .bar .warn{color:#fca5a5}
  .sheet{width:210mm;height:297mm;margin:10mm auto;background:#fff;display:flex;align-items:center;justify-content:center;page-break-after:always}
  .grid{display:grid;grid-template-columns:repeat(3,60mm);grid-template-rows:repeat(4,60mm);direction:ltr;outline:.2mm dashed #bbb;outline-offset:3mm}
  .card{width:60mm;height:60mm;position:relative;overflow:hidden;direction:rtl}
  .front{background:#0d0b14;border:.15mm solid #333}
  .ring{position:absolute;inset:3mm;border-radius:6mm;background:conic-gradient(from 200deg,#ff3d8b,#ffd23f,#22d3ee,#a78bfa,#ff3d8b)}
  .ring::before{content:"";position:absolute;inset:1.2mm;border-radius:5mm;background:#0d0b14}
  .brand{position:absolute;top:3.2mm;width:100%;text-align:center;color:#f4f1ff;font-size:8pt;font-weight:500}
  .brand b{color:#ff3d8b;font-weight:800}
  .qr{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:34mm;height:34mm;background:#fff;border-radius:2.5mm;padding:2.2mm}
  .qr svg{width:100%;height:100%;display:block}
  .front .no{position:absolute;bottom:3mm;width:100%;text-align:center;color:#a59fc0;font-size:7pt}
  .back{color:#0d0b14;border:.15mm solid rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5mm 4mm;text-align:center}
  .artist{font-weight:700;line-height:1.15;min-height:9mm;display:flex;align-items:flex-end}
  .year{font-size:40pt;font-weight:900;line-height:1;margin:2.5mm 0;letter-spacing:-1pt}
  .title{font-weight:500;line-height:1.15;min-height:9mm}
  .back .no{position:absolute;bottom:2mm;left:3mm;font-size:6pt;opacity:.55}
  @media print{.bar{display:none}body{background:#fff}.sheet{margin:0}}
</style>
</head>
<body>
<div class="bar">
  <span>קלפים להדפסה</span>
  <label>רק קלפים מספר: <input id="only" placeholder="לדוגמה: 5, 17, 101 (ריק = הכל)"></label>
  <button id="go">עדכן</button>
  <button id="print">הדפס</button>
  <span>הדפסה דו־צדדית, היפוך לאורך הצד הארוך, גודל 100%</span>
  <span class="warn" id="warn"></span>
</div>
<div id="pages"></div>

<script src="songs.js"></script>
<script>
const PALETTE = ['#ff3d8b','#22d3ee','#ffd23f','#a78bfa','#34d399','#fb923c'];
const BASE = new URL('.', location.href).href;              // הכתובת של האתר עצמו
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fit = (text, base, longer) => text.length <= longer ? base : Math.max(base * longer / text.length, base * .55);

function qrSvg(data){
  const q = qrcode(0, 'M'); q.addData(data); q.make();
  const n = q.getModuleCount(); let r = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#0d0b14">${r}</svg>`;
}
const front = s => `<div class="card front"><div class="ring"></div><div class="brand">פסקול <b>הזמן</b></div>
  <div class="qr">${qrSvg(BASE + '#' + s.n)}</div><div class="no">#${s.n}</div></div>`;
const back = s => `<div class="card back" style="background:${PALETTE[s.n % PALETTE.length]}">
  <div class="artist" style="font-size:${fit(s.a, 11.5, 18).toFixed(1)}pt">${esc(s.a)}</div>
  <div class="year">${s.y}</div>
  <div class="title" style="font-size:${fit(s.t, 13, 16).toFixed(1)}pt">${esc(s.t)}</div><div class="no">#${s.n}</div></div>`;
const EMPTY = '<div class="card"></div>';

let ALL = [];
function render(){
  const want = $only.value.split(/[^\d]+/).filter(Boolean).map(Number);
  const list = (want.length ? ALL.filter(s => want.includes(s.n)) : ALL).slice().sort((a, b) => a.n - b.n);
  let html = '';
  for (let p = 0; p < list.length; p += 12){
    const chunk = list.slice(p, p + 12);
    const f = chunk.map(front), b = chunk.map(back);
    while (f.length < 12){ f.push(EMPTY); b.push(EMPTY); }
    const mirrored = [0,1,2,3].flatMap(r => b.slice(r * 3, r * 3 + 3).reverse());   // גב מוחזר במראה להדפסה דו-צדדית
    html += `<section class="sheet"><div class="grid">${f.join('')}</div></section>`;
    html += `<section class="sheet"><div class="grid">${mirrored.join('')}</div></section>`;
  }
  document.getElementById('pages').innerHTML = html;
}
const $only = document.getElementById('only');
document.getElementById('go').onclick = render;
document.getElementById('print').onclick = () => window.print();
$only.value = new URLSearchParams(location.search).get('only') || '';
loadSongs().then(({songs, problems}) => {
  ALL = songs; render();
  if (problems.length) document.getElementById('warn').textContent = 'בעיות ב-songs.csv: ' + problems.join(' · ');
});
</script>
</body>
</html>
