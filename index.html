<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>פסקול הזמן</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#181424; --ink:#f4f1ff; --muted:#a59fc0;
    --pink:#ff3d8b; --cyan:#22d3ee; --yellow:#ffd23f; --line:#2a2440;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .brand{font-weight:800;letter-spacing:.5px;font-size:20px}
  .brand span{color:var(--pink)}
  .cardno{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:18px}

  /* The record: blurred YouTube player underneath, decorative disc on top */
  .record{position:relative;width:min(78vw,320px);aspect-ratio:1;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 6px #000,0 0 40px rgba(255,61,139,.35),0 0 80px rgba(34,211,238,.15)}
  #yt{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(22px) saturate(.6) brightness(.55);transform:scale(1.2)}
  #yt iframe{width:100%;height:100%;border:0}
  .grooves{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.55) 0 2px,rgba(0,0,0,.25) 2px 5px),
               radial-gradient(circle,rgba(0,0,0,0) 0 30%,rgba(0,0,0,.35) 70%)}
  .label{position:absolute;inset:34%;border-radius:50%;pointer-events:none;
    background:conic-gradient(var(--pink),var(--yellow),var(--cyan),var(--pink));
    display:flex;align-items:center;justify-content:center;font-size:34px;color:#0d0b14;font-weight:900}
  .label::after{content:"";position:absolute;width:12%;height:12%;border-radius:50%;background:#0d0b14}
  .spin .grooves,.spin .label{animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* tap blockers: keep taps away from YouTube's title / logo links */
  .block{position:absolute;left:0;right:0;height:24%;z-index:2}
  .block.top{top:0}.block.bottom{bottom:0}

  .progress{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .25s linear}
  .status{min-height:22px;color:var(--muted);font-size:15px;text-align:center}

  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
  button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 10px;font-size:16px;cursor:pointer}
  button:active{transform:scale(.97)}
  button.primary{grid-column:1/-1;background:linear-gradient(90deg,var(--pink),#ff7a59);border:0;font-weight:800;font-size:20px;padding:16px}
  button.reveal{grid-column:1/-1;background:transparent;border:1px dashed var(--muted);color:var(--muted)}
  button:disabled{opacity:.4}

  .answer{display:none;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .answer .y{font-size:64px;font-weight:900;line-height:1;color:var(--yellow)}
  .answer .t{font-size:22px;font-weight:800;margin-top:8px}
  .answer .a{font-size:17px;color:var(--muted);margin-top:4px}

  .next{display:flex;gap:8px;width:100%}
  .next input{flex:1;min-width:0;font:inherit;font-size:18px;text-align:center;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:14px;padding:12px}
  .next button{white-space:nowrap}
  .hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}

  #scanner{display:none;position:fixed;inset:0;background:#000;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #scanner video{width:min(90vw,420px);border-radius:16px}
  #scanner button{min-width:140px}

  /* test page */
  #test{display:none;width:100%;max-width:900px}
  #test table{width:100%;border-collapse:collapse;font-size:14px}
  #test td,#test th{border-bottom:1px solid var(--line);padding:6px;text-align:right}
  .ok{color:#4ade80}.bad{color:#f87171}.wait{color:var(--muted)}
  #testyt{position:fixed;left:-9999px;top:0;width:320px;height:180px}
</style>
</head>
<body>
<header>
  <div class="brand">פסקול <span>הזמן</span></div>
  <div class="cardno" id="cardno">—</div>
</header>

<main id="game">
  <div class="record" id="record">
    <div id="yt"></div>
    <div class="grooves"></div>
    <div class="label" id="labelIcon">▶</div>
    <div class="block top"></div><div class="block bottom"></div>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="status" id="status">טוען…</div>

  <div class="controls">
    <button class="primary" id="playBtn" disabled>▶ נגן קטע</button>
    <button id="replayBtn" disabled>↺ מההתחלה</button>
    <button id="moreBtn" disabled>+15 שנ׳</button>
    <button id="pauseBtn" disabled>❚❚ עצור</button>
    <button class="reveal" id="revealBtn">גלה תשובה</button>
  </div>

  <div class="answer" id="answer">
    <div class="y" id="ansYear"></div>
    <div class="t" id="ansTitle"></div>
    <div class="a" id="ansArtist"></div>
  </div>

  <div class="next">
    <input id="numIn" inputmode="numeric" pattern="[0-9]*" placeholder="מספר קלף">
    <button id="goBtn">עבור</button>
    <button id="scanBtn">📷 סרוק</button>
  </div>
  <div class="hint">סורקים את הקלף, שומעים קטע מהשיר ומנחשים את השנה.<br>
    אם הנגינה לא מתחילה בלחיצה על הכפתור, הקישו ישירות על התקליט.</div>
</main>

<div id="scanner">
  <video id="cam" playsinline muted></video>
  <div class="hint" style="color:#fff">כוונו את המצלמה לקוד שעל הקלף</div>
  <button id="scanClose">ביטול</button>
</div>

<section id="test">
  <h2>בדיקת סרטונים</h2>
  <p class="hint" style="text-align:right">הבדיקה מנגנת כל סרטון לשנייה בהשתקה ומסמנת אילו חסומים להטמעה. עמוד זה חושף את כל התשובות.</p>
  <button id="testStart" class="primary" style="width:100%">התחל בדיקה</button>
  <p id="testSummary" class="status"></p>
  <table><thead><tr><th>#</th><th>שנה</th><th>שיר</th><th>מבצע</th><th>סרטון</th><th>מצב</th></tr></thead><tbody id="testBody"></tbody></table>
  <div id="testyt"></div>
</section>

"n":96,"t":"ראי רחל ראי (שוב לא נלך)","a":"אריק לביא","y":1967,"v":["YiKwGelfFv0","9HWHtxWogAw"]},{"n":97,"t":"שיר הטלפון","a":"הגשש החיוור","y":1966,"v":["x-vzTRqSBaQ"]},{"n":98,"t":"צריך לצלצל פעמיים","a":"שושנה דמארי","y":1952,"v":["PFVOCBbONYo","PP3KCrOjKG0"]},{"n":99,"t":"שיר לשלום","a":"להקת הנח\"ל","y":1969,"v":["N8gDVr8AseM","d4JyiXsta10"]},{"n":100,"t":"מי זאת","a":"אנה זק","y":2022,"v":["bcuRKDY0Rz0","rqdktvmJbUo"]}];
const CLIP = 30;          // seconds per clip
const BY_N = Object.fromEntries(SONGS.map(s => [s.n, s]));

const $ = id => document.getElementById(id);
let player, song, vidIdx = 0, clipStart = 0, clipEnd = CLIP, ticker = null, ready = false, everPlayed = false;

function parseCard(){
  const h = location.hash.replace('#','');
  if (h === 'test') return 'test';
  const q = new URLSearchParams(location.search).get('n');
  const n = parseInt(h || q, 10);
  return BY_N[n] ? n : null;
}

/* ---------- YouTube ---------- */
function loadYT(){
  if (window.YT && YT.Player) return Promise.resolve();
  return new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
}
const PV = {controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3, playsinline:1, modestbranding:1};

async function startGame(n){
  song = BY_N[n]; vidIdx = 0; everPlayed = false;
  $('cardno').textContent = 'קלף #' + n;
  $('answer').style.display = 'none';
  $('ansYear').textContent = song.y; $('ansTitle').textContent = song.t; $('ansArtist').textContent = song.a;
  setStatus('טוען…'); setBar(0); enable(false);
  await loadYT();
  if (player && ready) { player.cueVideoById({videoId: song.v[0]}); enable(true); setStatus('מוכן — לחצו נגן'); return; }
  player = new YT.Player('yt', {videoId: song.v[0], playerVars: PV,
    events: {onReady, onStateChange, onError}});
}
function onReady(){ ready = true; enable(true); setStatus('מוכן — לחצו נגן'); }
function onError(e){
  // 100 = not found, 101/150 = embedding blocked, 2/5 = bad id / html5 error
  if (vidIdx + 1 < song.v.length){
    vidIdx++; everPlayed = false;
    setStatus('מנסה מקור חלופי…');
    player.loadVideoById({videoId: song.v[vidIdx]});
  } else {
    setStatus('הסרטון לא זמין להטמעה. אפשר לגלות את התשובה או לעבור לקלף אחר.');
    enable(false); $('revealBtn').disabled = false;
  }
}
function onStateChange(e){
  const S = YT.PlayerState;
  if (e.data === S.PLAYING){
    if (!everPlayed){
      everPlayed = true;
      const d = player.getDuration() || 180;
      clipStart = Math.max(0, Math.min(30, Math.floor(d * 0.2)));
      clipEnd = Math.min(d, clipStart + CLIP);
      if (Math.abs(player.getCurrentTime() - clipStart) > 2) player.seekTo(clipStart, true);
    }
    $('record').classList.add('spin'); setStatus('מתנגן…'); startTicker();
  } else {
    $('record').classList.remove('spin'); stopTicker();
    if (e.data === S.PAUSED && everPlayed) setStatus('נעצר');
    if (e.data === S.ENDED) setStatus('השיר נגמר');
  }
}
function startTicker(){
  stopTicker();
  ticker = setInterval(() => {
    const t = player.getCurrentTime();
    setBar((t - clipStart) / (clipEnd - clipStart));
    if (t >= clipEnd){ player.pauseVideo(); setStatus('נגמר הקטע — מה השנה?'); }
  }, 250);
}
function stopTicker(){ if (ticker) clearInterval(ticker); ticker = null; }
function setBar(f){ $('bar').style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; }
function setStatus(t){ $('status').textContent = t; }
function enable(on){ ['playBtn','replayBtn','moreBtn','pauseBtn'].forEach(id => $(id).disabled = !on); }

$('playBtn').onclick = () => {
  if (!player) return;
  if (everPlayed && player.getCurrentTime() >= clipEnd - 0.3) player.seekTo(clipStart, true);
  player.playVideo();
  setTimeout(() => { if (player.getPlayerState() !== YT.PlayerState.PLAYING)
    setStatus('הקישו ישירות על התקליט כדי להתחיל'); }, 1500);
};
$('replayBtn').onclick = () => { if (!player) return; player.seekTo(clipStart, true); player.playVideo(); };
$('moreBtn').onclick = () => {
  if (!player) return;
  clipEnd = Math.min(player.getDuration() || clipEnd + 15, clipEnd + 15); player.playVideo();
};
$('pauseBtn').onclick = () => player && player.pauseVideo();
$('revealBtn').onclick = () => { $('answer').style.display = 'block'; };

function goTo(n){
  n = parseInt(n, 10);
  if (!BY_N[n]) { setStatus('אין קלף כזה'); return; }
  if (player && player.stopVideo) player.stopVideo();
  history.replaceState(null, '', '#' + n);
  startGame(n);
}
$('goBtn').onclick = () => goTo($('numIn').value);
$('numIn').addEventListener('keydown', e => { if (e.key === 'Enter') goTo($('numIn').value); });

/* ---------- in-page QR scanner (keeps one tab, audio stays unlocked) ---------- */
let stream = null, scanning = false;
function cardFromText(t){
  const m = String(t).match(/[#?&]n?=?(\d{1,3})\s*$/) || String(t).match(/(\d{1,3})\s*$/);
  return m ? parseInt(m[1], 10) : null;
}
async function getDecoder(){
  if ('BarcodeDetector' in window){
    try { const bd = new BarcodeDetector({formats:['qr_code']});
      return async v => { const r = await bd.detect(v); return r[0] && r[0].rawValue; }; } catch(e){}
  }
  if (!window.jsQR) await new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const c = document.createElement('canvas'), x = c.getContext('2d', {willReadFrequently:true});
  return async v => { c.width = v.videoWidth; c.height = v.videoHeight; if (!c.width) return null;
    x.drawImage(v, 0, 0); const d = x.getImageData(0, 0, c.width, c.height); const r = jsQR(d.data, c.width, c.height); return r && r.data; };
}
async function openScanner(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  } catch(e){ setStatus('אין גישה למצלמה — אפשר לסרוק עם אפליקציית המצלמה או להקליד מספר'); return; }
  if (player && player.pauseVideo) player.pauseVideo();
  $('scanner').style.display = 'flex'; const v = $('cam'); v.srcObject = stream; await v.play();
  const decode = await getDecoder(); scanning = true;
  const loop = async () => {
    if (!scanning) return;
    try { const txt = await decode(v); const n = txt && cardFromText(txt);
      if (n && BY_N[n]) { closeScanner(); goTo(n); return; } } catch(e){}
    setTimeout(loop, 250);
  };
  loop();
}
function closeScanner(){ scanning = false; $('scanner').style.display = 'none'; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
$('scanBtn').onclick = openScanner; $('scanClose').onclick = closeScanner;

/* ---------- test page ---------- */
async function runTests(){
  $('testStart').disabled = true; await loadYT();
  const rows = []; SONGS.slice().sort((a,b)=>a.y-b.y).forEach(s => s.v.forEach((v,i) => rows.push({s, v, i})));
  const body = $('testBody'); body.innerHTML = '';
  rows.forEach(r => { const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.s.n}</td><td>${r.s.y}</td><td>${r.s.t}</td><td>${r.s.a}</td>
      <td><a href="https://youtu.be/${r.v}" target="_blank" style="color:var(--cyan)">${r.i ? 'חלופי' : 'ראשי'}</a></td><td class="wait">…</td>`;
    r.cell = tr.lastElementChild; body.appendChild(tr); });
  let tp, current, resolveOne;
  await new Promise(res => { tp = new YT.Player('testyt', {playerVars:{...PV, mute:1, autoplay:1},
    events:{onReady:res,
      onStateChange:e => { if (e.data === YT.PlayerState.PLAYING && resolveOne) resolveOne('ok'); },
      onError:e => resolveOne && resolveOne('err ' + e.data)}}); });
  let bad = 0;
  for (const r of rows){
    current = r;
    const res = await new Promise(res => { resolveOne = res; tp.mute(); tp.loadVideoById(r.v); setTimeout(() => res('timeout'), 9000); });
    resolveOne = null; tp.stopVideo();
    r.cell.textContent = res === 'ok' ? '✓' : '✗ ' + res; r.cell.className = res === 'ok' ? 'ok' : 'bad';
    if (res !== 'ok') bad++;
  }
  // per-song verdict: a song fails only if all its videos fail
  const failedSongs = SONGS.filter(s => rows.filter(r => r.s === s).every(r => r.cell.className === 'bad'));
  $('testSummary').textContent = `נבדקו ${rows.length} סרטונים, ${bad} נכשלו. שירים ללא אף מקור עובד: ` +
    (failedSongs.length ? failedSongs.map(s => '#' + s.n + ' ' + s.t).join(', ') : 'אין 🎉');
}
$('testStart').onclick = runTests;

/* ---------- boot ---------- */
function boot(){
  const c = parseCard();
  if (c === 'test'){ $('game').style.display = 'none'; $('test').style.display = 'block'; $('cardno').textContent = 'בדיקה'; return; }
  $('game').style.display = ''; $('test').style.display = 'none';
  if (c) startGame(c);
  else { $('cardno').textContent = 'אין קלף'; setStatus('סרקו קלף או הקלידו את מספרו'); $('revealBtn').disabled = true; }
}
window.addEventListener('hashchange', boot);
boot();
