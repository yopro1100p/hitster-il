<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>פסקול הזמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b14;--panel:#181424;--ink:#f4f1ff;--muted:#a59fc0;--pink:#ff3d8b;--cyan:#22d3ee;--yellow:#ffd23f;--line:#2a2440}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .brand{font-weight:800;font-size:21px}.brand span{color:var(--pink)}
  .cardno{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px}

  .record{position:relative;width:min(76vw,300px);aspect-ratio:1;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 6px #000,0 0 40px rgba(255,61,139,.35),0 0 80px rgba(34,211,238,.15);transition:opacity .3s}
  .record.idle{opacity:.45}
  #yt{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(22px) saturate(.6) brightness(.55);transform:scale(1.2)}
  #yt iframe{width:100%;height:100%;border:0}
  .grooves{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,rgba(0,0,0,.55) 0 2px,rgba(0,0,0,.25) 2px 5px),#0d0b14}
  .label{position:absolute;inset:34%;border-radius:50%;pointer-events:none;background:conic-gradient(var(--pink),var(--yellow),var(--cyan),var(--pink))}
  .label::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#0d0b14}
  .spin .grooves,.spin .label{animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .block{position:absolute;inset:0;z-index:2}

  .progress{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .25s linear}
  .status{min-height:22px;color:var(--muted);font-size:15px;text-align:center}

  button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.35;pointer-events:none}
  button svg{width:22px;height:22px;flex:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  #playBtn{width:100%;background:linear-gradient(90deg,var(--pink),#ff7a59);border:0;font-weight:800;font-size:20px;padding:17px}
  #playBtn.nudge{animation:nudge 1s ease-in-out infinite}
  @keyframes nudge{50%{box-shadow:0 0 0 8px rgba(255,61,139,.25)}}
  #revealBtn{width:100%;background:transparent;border:1px dashed var(--muted);color:var(--muted)}
  #scanBtn{width:100%;font-weight:700;font-size:18px;padding:16px;color:var(--cyan);background:rgba(34,211,238,.08);border:1.5px solid var(--cyan)}
  #scanBtn.main{color:#0d0b14;background:var(--cyan);font-size:20px;padding:18px}

  .answer{display:none;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .answer.show{display:block;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.9);opacity:0}}
  .answer .y{font-size:64px;font-weight:900;line-height:1;color:var(--yellow)}
  .answer .t{font-size:22px;font-weight:800;margin-top:8px}
  .answer .a{font-size:17px;color:var(--muted);margin-top:4px}

  #scanner{display:none;position:fixed;inset:0;background:#000;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .finder{position:relative;width:min(82vw,360px);aspect-ratio:1;border-radius:22px;overflow:hidden}
  .finder video{width:100%;height:100%;object-fit:cover}
  .finder::after{content:"";position:absolute;inset:14%;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.45);border:3px solid var(--cyan)}
  #scanner p{color:#fff;margin:0;font-size:16px}
  #scanClose{min-width:150px}

  #test{display:none;width:100%;max-width:900px}
  #test table{width:100%;border-collapse:collapse;font-size:14px}
  #test td,#test th{border-bottom:1px solid var(--line);padding:6px;text-align:right}
  .ok{color:#4ade80}.bad{color:#f87171}.wait{color:var(--muted)}
  #testyt{position:fixed;left:-9999px;top:0;width:320px;height:180px}
</style>
</head>
<body>
<header>
  <div class="brand">פסקול <span>הזמן</span></div>
  <div class="cardno" id="cardno">—</div>
</header>

<main id="game">
  <div class="record idle" id="record">
    <div id="yt"></div><div class="grooves"></div><div class="label"></div><div class="block"></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="status" id="status">טוען…</div>

  <button id="playBtn" disabled></button>
  <div class="row">
    <button id="replayBtn" disabled>↺ מההתחלה</button>
    <button id="moreBtn" disabled></button>
  </div>
  <button id="revealBtn" disabled>גלה תשובה</button>
  <div class="answer" id="answer"><div class="y" id="ansYear"></div><div class="t" id="ansTitle"></div><div class="a" id="ansArtist"></div></div>

  <button id="scanBtn" class="main">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
    <span id="scanLabel">סרוק קלף</span>
  </button>
</main>

<div id="scanner">
  <div class="finder"><video id="cam" playsinline muted></video></div>
  <p>כוונו את המצלמה לקוד שעל הקלף</p>
  <button id="scanClose">ביטול</button>
</div>

<section id="test">
  <h2>בדיקת סרטונים</h2>
  <p class="hint" style="color:var(--muted)">מנגן כל סרטון בהשתקה ומסמן אילו חסומים להטמעה. העמוד חושף את כל התשובות.</p>
  <p id="csvProblems" class="bad"></p>
  <button id="testStart" style="width:100%;background:var(--pink);border:0;font-weight:800">התחל בדיקה</button>
  <p id="testSummary" class="status"></p>
  <table><thead><tr><th>#</th><th>שנה</th><th>שיר</th><th>מבצע</th><th>סרטון</th><th>מצב</th></tr></thead><tbody id="testBody"></tbody></table>
  <div id="testyt"></div>
</section>

<script src="songs.js"></script>
<script>
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
let SONGS = [], BY_N = {}, problems = [];
let player, playerReady = false, song = null, vidIdx = 0, clipStart = 0, clipEnd = 0, ticker = null, began = false, playing = false;

$('moreBtn').textContent = `+${SETTINGS.extraSeconds} שנ׳`;
function setStatus(t){ $('status').textContent = t; }
function setBar(f){ $('bar').style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; }
function setPlaying(on){
  playing = on;
  $('playBtn').innerHTML = on ? ICON_PAUSE + 'עצור' : ICON_PLAY + 'נגן';
  $('record').classList.toggle('spin', on);
  if (on) $('playBtn').classList.remove('nudge');
}
function enableControls(on){ ['playBtn','replayBtn','moreBtn','revealBtn'].forEach(id => $(id).disabled = !on); }
setPlaying(false);

/* ---------- YouTube ---------- */
const PV = {controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3, playsinline:1, modestbranding:1};
function loadYT(){
  if (window.YT && YT.Player) return Promise.resolve();
  return new Promise(res => { window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); });
}
async function ensurePlayer(){
  if (playerReady) return;
  await loadYT();
  await new Promise(res => { player = new YT.Player('yt', {playerVars: PV,
    events: {onReady: () => { playerReady = true; res(); }, onStateChange, onError}}); });
}

async function startSong(n, auto){
  song = BY_N[n]; vidIdx = 0; began = false;
  $('cardno').textContent = 'קלף #' + n;
  $('answer').classList.remove('show');
  $('ansYear').textContent = song.y; $('ansTitle').textContent = song.t; $('ansArtist').textContent = song.a;
  $('record').classList.remove('idle'); $('scanBtn').classList.remove('main'); $('scanLabel').textContent = 'סרוק קלף הבא';
  enableControls(true); setBar(0); setStatus('טוען…');
  await ensurePlayer();
  loadVideo(auto);
}
function loadVideo(auto){
  const id = song.v[vidIdx];
  if (auto) {
    player.loadVideoById({videoId: id});            // מנסה לנגן מיד
    setTimeout(() => { if (!playing) { setStatus('לחצו נגן'); $('playBtn').classList.add('nudge'); } }, 2500);
  } else { player.cueVideoById({videoId: id}); setStatus('לחצו נגן'); }
}
function onError(){
  if (song && vidIdx + 1 < song.v.length){ vidIdx++; began = false; setStatus('מנסה מקור חלופי…'); loadVideo(true); }
  else { setStatus('הסרטון לא זמין. אפשר לגלות תשובה או לסרוק קלף אחר.'); ['playBtn','replayBtn','moreBtn'].forEach(id => $(id).disabled = true); }
}
function onStateChange(e){
  if (e.data === YT.PlayerState.PLAYING){
    if (!began){
      began = true;
      const d = player.getDuration() || 180;
      clipStart = song.start != null ? song.start : Math.max(0, Math.min(30, Math.floor(d * 0.2)));
      clipEnd = Math.min(d, clipStart + SETTINGS.clipSeconds);
      if (Math.abs(player.getCurrentTime() - clipStart) > 2) player.seekTo(clipStart, true);
    }
    setPlaying(true); setStatus('מתנגן…'); startTicker();
  } else if (e.data !== YT.PlayerState.BUFFERING) {
    setPlaying(false); stopTicker();
    if (e.data === YT.PlayerState.ENDED) setStatus('השיר נגמר');
  }
}
function startTicker(){
  stopTicker();
  ticker = setInterval(() => {
    const t = player.getCurrentTime();
    setBar((t - clipStart) / (clipEnd - clipStart));
    if (t >= clipEnd){ player.pauseVideo(); setStatus('נגמר הקטע — מה השנה?'); }
  }, 250);
}
function stopTicker(){ clearInterval(ticker); ticker = null; }

$('playBtn').onclick = () => {
  if (!playerReady) return;
  if (playing) { player.pauseVideo(); setStatus('נעצר'); return; }
  if (began && player.getCurrentTime() >= clipEnd - 0.3) player.seekTo(clipStart, true);
  player.playVideo();
};
$('replayBtn').onclick = () => { player.seekTo(clipStart, true); player.playVideo(); };
$('moreBtn').onclick = () => { clipEnd = Math.min(player.getDuration() || 1e9, Math.max(clipEnd, player.getCurrentTime()) + SETTINGS.extraSeconds); player.playVideo(); };
$('revealBtn').onclick = () => $('answer').classList.add('show');

/* ---------- סורק QR בתוך הדף ---------- */
let stream = null, scanning = false;
function cardFromText(t){ const m = String(t).match(/(\d{1,4})\s*$/); return m ? parseInt(m[1], 10) : null; }
async function getDecoder(){
  if ('BarcodeDetector' in window){
    try { const bd = new BarcodeDetector({formats:['qr_code']}); return async v => (await bd.detect(v))[0]?.rawValue; } catch(e){}
  }
  if (!window.jsQR) await new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const c = document.createElement('canvas'), x = c.getContext('2d', {willReadFrequently:true});
  return async v => { c.width = v.videoWidth; c.height = v.videoHeight; if (!c.width) return null;
    x.drawImage(v, 0, 0); const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height); return r && r.data; };
}
async function openScanner(){
  ensurePlayer();                                   // מכין את הנגן בזמן שהמצלמה נפתחת
  if (playing) player.pauseVideo();
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ setStatus('אין גישה למצלמה — אפשר לסרוק עם אפליקציית המצלמה של הטלפון'); return; }
  $('scanner').style.display = 'flex'; const v = $('cam'); v.srcObject = stream; await v.play();
  const decode = await getDecoder(); scanning = true;
  const loop = async () => {
    if (!scanning) return;
    try { const n = cardFromText(await decode(v));
      if (n && BY_N[n]) { closeScanner(); history.replaceState(null, '', '#' + n); startSong(n, true); return; } } catch(e){}
    setTimeout(loop, 200);
  };
  loop();
}
function closeScanner(){ scanning = false; $('scanner').style.display = 'none'; stream?.getTracks().forEach(t => t.stop()); stream = null; }
$('scanBtn').onclick = openScanner; $('scanClose').onclick = closeScanner;

/* ---------- דף בדיקה (#test) ---------- */
async function runTests(){
  $('testStart').disabled = true; await loadYT();
  const rows = []; SONGS.slice().sort((a,b) => a.y - b.y).forEach(s => s.v.forEach((v,i) => rows.push({s, v, i})));
  const body = $('testBody'); body.innerHTML = '';
  rows.forEach(r => { const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.s.n}</td><td>${r.s.y}</td><td>${r.s.t}</td><td>${r.s.a}</td>
      <td><a href="https://youtu.be/${r.v}" target="_blank" style="color:var(--cyan)">${r.i ? 'גיבוי' : 'ראשי'}</a></td><td class="wait">…</td>`;
    r.cell = tr.lastElementChild; body.appendChild(tr); });
  let tp, done;
  await new Promise(res => { tp = new YT.Player('testyt', {playerVars:{...PV, mute:1, autoplay:1}, events:{onReady:res,
    onStateChange:e => e.data === YT.PlayerState.PLAYING && done && done('ok'), onError:e => done && done('שגיאה ' + e.data)}}); });
  let bad = 0;
  for (const r of rows){
    const res = await new Promise(res => { done = res; tp.mute(); tp.loadVideoById(r.v); setTimeout(() => res('לא נטען'), 9000); });
    done = null; tp.stopVideo();
    r.cell.textContent = res === 'ok' ? '✓' : '✗ ' + res; r.cell.className = res === 'ok' ? 'ok' : 'bad'; if (res !== 'ok') bad++;
  }
  const dead = SONGS.filter(s => rows.filter(r => r.s === s).every(r => r.cell.className === 'bad'));
  $('testSummary').textContent = `נבדקו ${rows.length} סרטונים, ${bad} נכשלו. שירים בלי אף סרטון עובד: ` + (dead.length ? dead.map(s => '#' + s.n + ' ' + s.t).join(', ') : 'אין 🎉');
}
$('testStart').onclick = runTests;

/* ---------- הפעלה ---------- */
(async () => {
  try { ({songs: SONGS, problems} = await loadSongs()); }
  catch(e){ setStatus('לא הצלחתי לטעון את songs.csv'); return; }
  BY_N = Object.fromEntries(SONGS.map(s => [s.n, s]));
  const h = location.hash.slice(1);
  if (h === 'test'){
    $('game').style.display = 'none'; $('test').style.display = 'block'; $('cardno').textContent = SONGS.length + ' שירים';
    $('csvProblems').textContent = problems.join(' · '); return;
  }
  const n = parseInt(h, 10);
  if (BY_N[n]) startSong(n, true);                  // נכנסו מסריקה במצלמת הטלפון
  else { setStatus('סרקו קלף כדי להתחיל'); $('cardno').textContent = SONGS.length + ' שירים'; ensurePlayer(); }
})();
</script>
</body>
</html>
